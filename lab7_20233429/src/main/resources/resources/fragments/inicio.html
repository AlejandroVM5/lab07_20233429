<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Portal de gestión comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Inyección del fragmento de la barra de navegación -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Portal de gestión comercial</h1>
        <p class="lead mt-3 text-muted">
            Bienvenido al sistema centralizado. Desde este portal podrás gestionar de manera eficiente la cartera de clientes, revisar el catálogo de productos disponibles y administrar el flujo de pedidos.
        </p>
    </div>

    <div class="row justify-content-center gap-4">
        <div class="col-md-3">
            <a th:href="@{/clientes}" class="btn btn-primary btn-lg w-100 shadow-sm py-3">Gestión de Clientes</a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/catalogo}" class="btn btn-success btn-lg w-100 shadow-sm py-3">Catálogo de Productos</a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/pedidos}" class="btn btn-warning btn-lg w-100 shadow-sm py-3 text-dark">Control de Pedidos</a>
        </div>
    </div>
</div>

</body>
</html>
